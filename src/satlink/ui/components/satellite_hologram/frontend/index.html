<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
  .card { position: relative; width: 100%; height: 226px; overflow: hidden; border: 1px solid rgba(103,212,255,.3); border-radius: 7px; background: radial-gradient(ellipse at 50% 52%, rgba(24,116,163,.18), transparent 57%), linear-gradient(145deg,#091f2d,#04111d 72%); box-shadow: inset 0 0 28px rgba(25,150,220,.08), 0 0 14px rgba(25,150,220,.06); color: #eaf8ff; font-family: 'DM Mono', Consolas, monospace; }
  .head { position: absolute; z-index: 4; top: 10px; left: 12px; right: 12px; display:flex; justify-content:space-between; align-items:center; color:#8cdef7; font-size:9px; letter-spacing:.08em; text-transform:uppercase; }
  .status { color:#71d7c1; text-align:right; }
  .viewport { position:absolute; inset:27px 8px 35px; overflow:hidden; background-image:linear-gradient(rgba(93,205,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(93,205,255,.035) 1px,transparent 1px); background-size:18px 18px; }
  .orbit { position:absolute; z-index:0; left:50%; top:50%; width:98px; height:98px; border:1px solid rgba(83,202,255,.24); border-radius:50%; transform:translate(-50%,-50%) rotateX(68deg) rotateZ(-20deg); box-shadow:0 0 12px rgba(72,192,255,.14); }
  .orbit:after { content:''; position:absolute; top:7px; left:19px; width:4px; height:4px; border-radius:50%; background:#71e2ff; box-shadow:0 0 8px #4dcaff; }
  model-viewer { position:absolute; inset:0; z-index:1; width:100%; height:100%; --poster-color:transparent; --progress-bar-color:#68dcff; --progress-bar-height:1px; filter:sepia(1) saturate(5) hue-rotate(150deg) brightness(1.2) contrast(1.25); }
  .overlay { position:absolute; z-index:2; inset:0; pointer-events:none; background:linear-gradient(180deg,transparent 20%,rgba(96,218,255,.06) 50%,transparent 52%); }
  .scan { position:absolute; z-index:3; top:0; left:0; width:100%; height:1px; pointer-events:none; background:linear-gradient(90deg,transparent,rgba(98,223,255,.5),transparent); animation:scan 4s linear infinite; }
  @keyframes scan { from { transform:translateY(0); } to { transform:translateY(164px); } }
  .unknown { position:absolute; z-index:1; inset:0; display:grid; place-items:center; color:rgba(111,219,255,.65); text-align:center; font-size:10px; line-height:1.6; }
  .unknown-mark { position:relative; width:62px; height:62px; margin:0 auto 9px; border:1px solid rgba(103,212,255,.42); border-radius:50%; box-shadow:0 0 20px rgba(60,196,255,.2), inset 0 0 18px rgba(60,196,255,.12); }
  .unknown-mark:before,.unknown-mark:after { content:''; position:absolute; inset:13px -9px; border:1px solid rgba(103,212,255,.38); border-radius:50%; transform:rotate(35deg); }
  .unknown-mark:after { transform:rotate(-35deg); }
  .foot { position:absolute; z-index:4; bottom:0; left:11px; right:11px; height:31px; display:flex; align-items:center; justify-content:space-between; gap:8px; border-top:1px solid rgba(103,212,255,.16); }
  .name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#effaff; font-size:11px; font-weight:600; }
  .source { flex:0 0 auto; max-width:48%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#79bfd2; text-decoration:none; font-size:8px; }
  .source:hover { color:#b5f0ff; text-decoration:underline; }
  @media (prefers-reduced-motion: reduce) { .scan { animation:none; } }
</style>
<script>
  window.ModelViewerElement = window.ModelViewerElement || {};
  window.ModelViewerElement.dracoDecoderLocation = new URL('draco/', document.baseURI).href;
</script>
<script type="module" src="model-viewer.min.js"></script>
</head>
<body>
<div class="card">
  <div class="head"><span id="kind">SATELLITE HOLOGRAM</span><span class="status" id="status">3D / LIVE</span></div>
  <div class="viewport">
    <div class="orbit"></div>
    <div id="unknown" class="unknown" hidden><div><div class="unknown-mark"></div><span>NO VERIFIED 3D MODEL<br>AVAILABLE FOR THIS OBJECT</span></div></div>
    <model-viewer id="model" camera-controls auto-rotate rotation-per-second="18deg" interaction-prompt="none" shadow-intensity="0" exposure="1.4" environment-image="neutral" touch-action="pan-y" loading="eager"></model-viewer>
    <div class="overlay"></div><div class="scan"></div>
  </div>
  <div class="foot"><span class="name" id="name"></span><a class="source" id="source" target="_blank" rel="noreferrer"></a></div>
</div>
<script>
(() => {
  const model = document.getElementById('model');
  const kind = document.getElementById('kind');
  const status = document.getElementById('status');
  const name = document.getElementById('name');
  const source = document.getElementById('source');
  const unknown = document.getElementById('unknown');
  let loadedFile = null;
  const send = (type, data = {}) => window.parent.postMessage({isStreamlitMessage:true, type, ...data}, '*');

  function render(args = {}) {
    name.textContent = args.name || '';
    kind.textContent = args.kind || 'SATELLITE HOLOGRAM';
    status.textContent = args.accuracyLabel || '3D / LIVE';
    source.textContent = args.sourceLabel || '';
    source.href = args.sourceUrl || '#';
    source.hidden = !args.sourceUrl;
    if (args.model) {
      unknown.hidden = true;
      model.hidden = false;
      model.alt = args.name || 'Satellite 3D model';
      const nextFile = args.model;
      if (loadedFile !== nextFile) {
        model.src = new URL('models/' + encodeURIComponent(nextFile), document.baseURI).href;
        loadedFile = nextFile;
      }
    } else {
      model.hidden = true;
      unknown.hidden = false;
      loadedFile = null;
    }
  }

  window.addEventListener('message', event => {
    if (event.data && event.data.type === 'streamlit:render') render(event.data.args || {});
  });
  send('streamlit:componentReady', {apiVersion:1});
  send('streamlit:setFrameHeight', {height:226});
})();
</script>
</body>
</html>
