[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "satlink"
version = "0.1.0"
description = "Satellite tracking, pass prediction, and ground station planning platform."
readme = "README.md"
authors = [{ name = "Tu Nombre", email = "tu.email@example.com" }]
requires-python = ">=3.10"
dependencies = [
    "skyfield>=1.48",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "fastapi>=0.117.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black",
    "flake8",
    "uvicorn[standard]>=0.30.0",
]

[tool.setuptools.package-data]
"satlink.core" = ["assets/tle/*.json", "assets/*.npz"]
